<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div id="spotlight" aria-hidden="true"></div>

<div class="site-wrapper">
  {{ partial "header.html" . }}
  <main class="container">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</div>

<!-- Nucleus Pet -->
<div id="nucleus" aria-hidden="true">
  <div class="n-glow"></div>
  <div class="n-core" id="n-core">
    <div class="n-shine"></div>
    <div class="n-grid"></div>
  </div>
  <div class="n-orbit n-o1"><div class="n-ring"></div></div>
  <div class="n-orbit n-o2"><div class="n-ring"></div></div>
  <div class="n-orbit n-o3"><div class="n-ring"></div></div>
  <canvas id="n-canvas" width="110" height="110"></canvas>
</div>

<script>
(function(){
  /* spotlight */
  var tx=innerWidth/2, ty=innerHeight/2, rx=tx, ry=ty;
  addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY},{passive:true});
  addEventListener('touchmove',function(e){var t=e.touches[0];if(t){tx=t.clientX;ty=t.clientY}},{passive:true});
  (function L(){
    rx+=(tx-rx)*.08; ry+=(ty-ry)*.08;
    document.documentElement.style.setProperty('--mx',rx.toFixed(1)+'px');
    document.documentElement.style.setProperty('--my',ry.toFixed(1)+'px');
    requestAnimationFrame(L);
  })();

  /* nucleus */
  var wrap  = document.getElementById('nucleus');
  var core  = document.getElementById('n-core');
  var cvs   = document.getElementById('n-canvas');
  var ctx   = cvs.getContext('2d');
  var CX=55, CY=55, D=Math.PI/180;
  var hovered=false, clickCount=0;

  /*
   * 三条轨道的屏幕投影参数
   * 轨道1: rotateX(72°)  ring w=96px → R=48
   *   x = CX + 48·cos(t)
   *   y = CY + 48·cos(72°)·sin(t)  = CY + 14.8·sin(t)
   *
   * 轨道2: rotateX(40°) rotateY(30°)  ring w=78px → R=39
   *   x = CX + 39·cos(30°)·cos(t) + 39·sin(40°)·sin(30°)·sin(t)
   *     = CX + 33.8·cos(t) + 12.5·sin(t)
   *   y = CY + 39·cos(40°)·sin(t)  = CY + 29.9·sin(t)
   *
   * 轨道3: rotateY(88°)  ring w=60px → R=30
   *   x = CX + 30·cos(88°)·cos(t)  ≈ CX + 1.05·cos(t)
   *   y = CY + 30·sin(t)
   */
  var orbits = [
    /* orbit 1a — 青色主粒子 */
    { t:0,    dt:0.025,  pos: function(t){ return {x: CX+48*Math.cos(t),             y: CY+14.8*Math.sin(t)          }; }, rgb:'0,229,255',   r:5,   tl:32 },
    /* orbit 1b — 青色对侧粒子 (offset π) */
    { t:Math.PI, dt:0.025, pos: function(t){ return {x: CX+48*Math.cos(t),           y: CY+14.8*Math.sin(t)          }; }, rgb:'0,200,255',   r:3.5, tl:22 },
    /* orbit 2  — 紫色粒子 */
    { t:1.0,  dt:-0.015, pos: function(t){ return {x: CX+33.8*Math.cos(t)+12.5*Math.sin(t), y: CY+29.9*Math.sin(t)  }; }, rgb:'192,132,252', r:4,   tl:24 },
    /* orbit 3  — 白色粒子 (近乎垂直) */
    { t:1.6,  dt:0.010,  pos: function(t){ return {x: CX+1.05*Math.cos(t),           y: CY+30*Math.sin(t)            }; }, rgb:'200,240,255', r:2.5, tl:16 }
  ];
  var trails = orbits.map(function(){ return []; });

  function drawAll(){
    var spd = hovered ? 2.5 : 1;
    orbits.forEach(function(o){ o.t += o.dt * spd; });

    ctx.clearRect(0,0,110,110);

    orbits.forEach(function(o, i){
      var p = o.pos(o.t);
      trails[i].push({x:p.x, y:p.y});
      if(trails[i].length > o.tl) trails[i].shift();

      /* trail */
      for(var j=0; j<trails[i].length; j++){
        var ratio = j/trails[i].length;
        var tp = trails[i][j];
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, Math.max(0.4, o.r*ratio*0.75), 0, Math.PI*2);
        ctx.fillStyle = 'rgba('+o.rgb+','+(ratio*0.55)+')';
        ctx.fill();
      }

      /* head glow */
      var g = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y, o.r*2.2);
      g.addColorStop(0,   'rgba(255,255,255,0.98)');
      g.addColorStop(0.35,'rgba('+o.rgb+',0.85)');
      g.addColorStop(1,   'rgba('+o.rgb+',0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, o.r*2.2, 0, Math.PI*2);
      ctx.fillStyle = g;
      ctx.fill();
    });

    requestAnimationFrame(drawAll);
  }
  drawAll();

  /* hover */
  wrap.addEventListener('mouseenter',function(){ hovered=true; });
  wrap.addEventListener('mouseleave',function(){ hovered=false; });

  /* click */
  wrap.addEventListener('click',function(){
    clickCount++;
    /* 双重冲击波 */
    [0,160].forEach(function(delay){
      setTimeout(function(){
        var w=document.createElement('div');
        w.className='n-shockwave';
        wrap.appendChild(w);
        setTimeout(function(){w.remove();},800);
      },delay);
    });
    /* 核心闪光 */
    core.classList.add('n-flash');
    setTimeout(function(){ core.classList.remove('n-flash'); },300);
    /* 每5次变紫 */
    if(clickCount%5===0){
      wrap.classList.add('n-purple');
      setTimeout(function(){ wrap.classList.remove('n-purple'); },1800);
    }
  });
})();
</script>
</body>
</html>
