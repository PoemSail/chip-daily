<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div id="spotlight" aria-hidden="true"></div>

<div class="site-wrapper">
  {{ partial "header.html" . }}
  <main class="container">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</div>

<!-- ══════════════════════════════════════════════
     NUCLEUS — 全息轨道球宠物
     三条轨道环 + 轨道粒子 + 点击冲击波
     ══════════════════════════════════════════════ -->
<div id="nucleus" aria-hidden="true">
  <!-- 环境光晕 -->
  <div class="n-glow"></div>

  <!-- 核心球体 -->
  <div class="n-core" id="n-core">
    <div class="n-shine"></div>
    <div class="n-grid"></div>
  </div>

  <!-- 轨道环 1 — 青蓝，倾斜 72°，顺时针 -->
  <div class="n-orbit n-o1"><div class="n-ring"></div></div>
  <!-- 轨道环 2 — 紫，倾斜 40°，逆时针 -->
  <div class="n-orbit n-o2"><div class="n-ring"></div></div>
  <!-- 轨道环 3 — 细白，垂直，顺时针 -->
  <div class="n-orbit n-o3"><div class="n-ring"></div></div>

  <!-- 轨道粒子（JS 驱动，贴合 ring 1 轨迹）-->
  <canvas id="n-canvas" width="110" height="110"
          style="position:absolute;inset:0;pointer-events:none;z-index:3"></canvas>
</div>

<script>
(function(){
  /* ─ spotlight ──────────────────────────── */
  var tx=innerWidth/2,ty=innerHeight/2,rx=tx,ry=ty;
  addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY},{passive:true});
  addEventListener('touchmove',function(e){
    var t=e.touches[0];if(t){tx=t.clientX;ty=t.clientY}
  },{passive:true});
  (function L(){rx+=(tx-rx)*.08;ry+=(ty-ry)*.08;
    document.documentElement.style.setProperty('--mx',rx.toFixed(1)+'px');
    document.documentElement.style.setProperty('--my',ry.toFixed(1)+'px');
    requestAnimationFrame(L);
  })();

  /* ─ nucleus ────────────────────────────── */
  var wrap  = document.getElementById('nucleus');
  var core  = document.getElementById('n-core');
  var cvs   = document.getElementById('n-canvas');
  var ctx   = cvs.getContext('2d');
  var CX=55, CY=55;        // canvas centre
  var RX=42, cos72=Math.cos(72*Math.PI/180);  // ring 1 projected radii
  var RY=RX*cos72;
  var theta=0;             // orbital angle
  var clickCount=0;
  var hovered=false;
  var SPEED=0.022;

  /* 轨道粒子 — canvas 逐帧绘制 */
  var trail=[];
  function drawOrbit(){
    theta += hovered ? SPEED*2.5 : SPEED;

    /* 粒子位置（椭圆投影） */
    var px = CX + RX*Math.cos(theta);
    var py = CY + RY*Math.sin(theta);

    /* 尾迹 */
    trail.push({x:px,y:py,a:1});
    if(trail.length>28) trail.shift();

    ctx.clearRect(0,0,110,110);

    /* 画尾迹 */
    for(var i=0;i<trail.length;i++){
      var p=trail[i], t=i/trail.length;
      ctx.beginPath();
      ctx.arc(p.x,p.y, 1.8*t,0,Math.PI*2);
      ctx.fillStyle='rgba(0,229,255,'+(t*0.7)+')';
      ctx.fill();
    }

    /* 画粒子头 */
    var grd=ctx.createRadialGradient(px,py,0,px,py,7);
    grd.addColorStop(0,'rgba(255,255,255,0.95)');
    grd.addColorStop(0.4,'rgba(0,229,255,0.8)');
    grd.addColorStop(1,'rgba(0,229,255,0)');
    ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();

    requestAnimationFrame(drawOrbit);
  }
  drawOrbit();

  /* hover 加速 */
  wrap.addEventListener('mouseenter',function(){hovered=true;});
  wrap.addEventListener('mouseleave',function(){hovered=false;});

  /* 点击 — 冲击波 + 核心爆闪 + 每5次变色 */
  wrap.addEventListener('click',function(){
    clickCount++;

    /* 冲击波：插入一个 div，CSS 动画 */
    for(var i=0;i<2;i++){
      (function(delay){
        setTimeout(function(){
          var w=document.createElement('div');
          w.className='n-shockwave';
          wrap.appendChild(w);
          setTimeout(function(){w.remove();},800);
        },delay);
      })(i*150);
    }

    /* 核心闪光 */
    core.classList.add('n-flash');
    setTimeout(function(){core.classList.remove('n-flash');},300);

    /* 每5次：轨道变紫色，1.5s 后恢复 */
    if(clickCount%5===0){
      wrap.classList.add('n-purple');
      setTimeout(function(){wrap.classList.remove('n-purple');},1600);
    }
  });
})();
</script>
</body>
</html>
