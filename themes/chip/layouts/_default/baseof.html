<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div id="spotlight" aria-hidden="true"></div>

<div class="site-wrapper">
  {{ partial "header.html" . }}
  <main class="container">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</div>

<!--
  NUCLEUS — 全息轨道球
  inline style 强制 fixed，防止任何 CSS 被覆盖
  三条轨道环 + 四粒子 Canvas + 呼吸光晕 + 点击冲击波
-->
<div id="nucleus"
     style="position:fixed!important;bottom:24px;right:24px;z-index:9999;
            width:110px;height:110px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;">

  <!-- 环境呼吸光晕 -->
  <div class="n-glow"></div>

  <!-- 三条轨道环（CSS 动画）-->
  <!-- 轨道1: 青色 72° rotateX 顺时针 4s -->
  <div class="n-orbit n-o1"><div class="n-ring n-r1"></div></div>
  <!-- 轨道2: 紫色 40°X+30°Y 逆时针 7s -->
  <div class="n-orbit n-o2"><div class="n-ring n-r2"></div></div>
  <!-- 轨道3: 白色近垂直 11s -->
  <div class="n-orbit n-o3"><div class="n-ring n-r3"></div></div>

  <!-- 核心球体：深蓝渐变 + 网格纹 + 高光 -->
  <div class="n-core" id="n-core">
    <div class="n-grid"></div>
    <div class="n-shine"></div>
  </div>

  <!-- Canvas：4粒子实时轨迹 -->
  <canvas id="n-cvs" width="110" height="110"
    style="position:absolute;inset:0;pointer-events:none;z-index:5;"></canvas>
</div>

<script>
(function(){
  /* ── spotlight ─────────────────────────────── */
  var tx=innerWidth/2,ty=innerHeight/2,rx=tx,ry=ty;
  addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY},{passive:true});
  addEventListener('touchmove',function(e){var t=e.touches[0];if(t){tx=t.clientX;ty=t.clientY}},{passive:true});
  (function L(){
    rx+=(tx-rx)*.08; ry+=(ty-ry)*.08;
    document.documentElement.style.setProperty('--mx',rx.toFixed(1)+'px');
    document.documentElement.style.setProperty('--my',ry.toFixed(1)+'px');
    requestAnimationFrame(L);
  })();

  /* ── nucleus ───────────────────────────────── */
  var wrap  = document.getElementById('nucleus');
  var core  = document.getElementById('n-core');
  var cvs   = document.getElementById('n-cvs');
  var ctx   = cvs.getContext('2d');

  /* JS再次强制 fixed，彻底防止覆盖 */
  wrap.style.position = 'fixed';

  var CX=55, CY=55, D=Math.PI/180;
  var hovered=false, clicks=0;

  /*
   * 三条轨道在屏幕上的投影椭圆参数：
   * 轨道1: rotateX(72°), ring r=48
   *   x = CX + 48·cos(t)   y = CY + 48·cos(72°)·sin(t) = CY+14.8·sin(t)
   *
   * 轨道2: rotateX(40°) rotateY(30°), ring r=39
   *   x = CX + 39·cos30°·cos(t) + 39·sin40°·sin30°·sin(t) = CX+33.8·cos(t)+12.5·sin(t)
   *   y = CY + 39·cos40°·sin(t) = CY+29.9·sin(t)
   *
   * 轨道3: rotateY(88°), ring r=30
   *   x = CX + 30·cos88°·cos(t) ≈ CX+1.05·cos(t)
   *   y = CY + 30·sin(t)
   */
  var P = [
    /* [0] 轨道1主粒子 — 青色大 */
    {t:0,      dt:0.025,  rgb:'0,229,255',   r:5.5, tl:34,
     xy:function(t){return{x:CX+48*Math.cos(t),          y:CY+14.8*Math.sin(t)}}},
    /* [1] 轨道1对侧粒子 — 青色小 */
    {t:Math.PI,dt:0.025,  rgb:'0,200,255',   r:3.5, tl:22,
     xy:function(t){return{x:CX+48*Math.cos(t),          y:CY+14.8*Math.sin(t)}}},
    /* [2] 轨道2粒子 — 紫色 */
    {t:1.0,    dt:-0.015, rgb:'192,132,252', r:4.5, tl:26,
     xy:function(t){return{x:CX+33.8*Math.cos(t)+12.5*Math.sin(t), y:CY+29.9*Math.sin(t)}}},
    /* [3] 轨道3粒子 — 白色 */
    {t:1.6,    dt:0.010,  rgb:'210,245,255', r:2.8, tl:18,
     xy:function(t){return{x:CX+1.05*Math.cos(t),        y:CY+30*Math.sin(t)}}}
  ];
  var trails = [[],[],[],[]];

  function frame(){
    var spd = hovered ? 2.5 : 1;
    ctx.clearRect(0,0,110,110);
    P.forEach(function(p,i){
      p.t += p.dt * spd;
      var pos = p.xy(p.t);
      trails[i].push({x:pos.x, y:pos.y});
      if(trails[i].length > p.tl) trails[i].shift();
      /* 尾迹 */
      for(var j=0;j<trails[i].length;j++){
        var ratio=j/trails[i].length, tp=trails[i][j];
        ctx.beginPath();
        ctx.arc(tp.x,tp.y,Math.max(0.5,p.r*ratio*0.7),0,Math.PI*2);
        ctx.fillStyle='rgba('+p.rgb+','+(ratio*0.6)+')';
        ctx.fill();
      }
      /* 粒子头（径向渐变光球）*/
      var g=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,p.r*2.4);
      g.addColorStop(0,'rgba(255,255,255,.98)');
      g.addColorStop(.3,'rgba('+p.rgb+',.88)');
      g.addColorStop(1,'rgba('+p.rgb+',0)');
      ctx.beginPath();
      ctx.arc(pos.x,pos.y,p.r*2.4,0,Math.PI*2);
      ctx.fillStyle=g;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();

  /* hover — 轨道加速（CSS 变量驱动） */
  wrap.addEventListener('mouseenter',function(){
    hovered=true;
    wrap.classList.add('n-fast');
  });
  wrap.addEventListener('mouseleave',function(){
    hovered=false;
    wrap.classList.remove('n-fast');
  });

  /* click — 冲击波 + 核心爆闪 + 每5次变紫 */
  wrap.addEventListener('click',function(){
    clicks++;
    [0,180].forEach(function(d){
      setTimeout(function(){
        var s=document.createElement('div');
        s.className='n-shock';
        wrap.appendChild(s);
        setTimeout(function(){s.remove();},800);
      },d);
    });
    core.classList.add('n-flash');
    setTimeout(function(){core.classList.remove('n-flash');},320);
    if(clicks%5===0){
      wrap.classList.add('n-purple');
      setTimeout(function(){wrap.classList.remove('n-purple');},1800);
    }
  });
})();
</script>
</body>
</html>
