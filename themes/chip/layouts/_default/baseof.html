<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>

<!-- Aurora background blobs -->
<div class="aurora" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- Mouse spotlight -->
<div id="spotlight" aria-hidden="true"></div>

<div class="site-wrapper">
  {{ partial "header.html" . }}
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</div>

<script>
(function() {
  var sp = document.getElementById('spotlight');
  var rx = 0, ry = 0, tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  var raf;

  document.addEventListener('mousemove', function(e) {
    tx = e.clientX; ty = e.clientY;
  }, { passive: true });

  // Smooth follow with lerp
  function tick() {
    rx += (tx - rx) * 0.08;
    ry += (ty - ry) * 0.08;
    document.documentElement.style.setProperty('--mx', rx.toFixed(1) + 'px');
    document.documentElement.style.setProperty('--my', ry.toFixed(1) + 'px');
    raf = requestAnimationFrame(tick);
  }
  tick();

  // Touch support
  document.addEventListener('touchmove', function(e) {
    if (e.touches[0]) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
  }, { passive: true });
})();
</script>
</body>
</html>
