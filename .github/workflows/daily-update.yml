name: 每日芯片日报自动更新

on:
  schedule:
    # 北京时间每天12:00 = UTC 04:00
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      date_override:
        description: "指定日期（格式 YYYY-MM-DD，留空则使用今天）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate daily report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python scripts/generate_daily.py

      - name: Configure git
        run: |
          git config user.name "芯片日报机器人"
          git config user.email "chip-daily-bot@users.noreply.github.com"

      - name: Commit new report
        run: |
          git add content/posts/
          git diff --quiet && git diff --staged --quiet && echo "没有新内容需要提交" || \
          git commit -m "📰 日报更新: $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"

      - name: Push changes
        run: git push

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
